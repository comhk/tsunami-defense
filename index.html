<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>海嘯：最後防線 · Tsunami: Last Line</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;background:#080c12;overflow:hidden;
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    display:flex;align-items:center;justify-content:center}
  #app{position:relative;width:960px;height:520px;transform-origin:center center;
    box-shadow:0 0 80px rgba(0,120,200,.25);border-radius:10px;overflow:hidden;
    background:#0b1018}
  canvas{display:block;width:960px;height:520px;cursor:crosshair}

  /* HUD */
  #hud{position:absolute;top:0;left:0;right:0;height:50px;padding:6px 12px;
    display:flex;gap:7px;align-items:center;pointer-events:none;
    font-size:12.5px;color:#dceaf5;text-shadow:0 2px 6px #000;z-index:5}
  .pill{background:rgba(10,22,34,.75);border:1px solid rgba(90,170,230,.35);
    border-radius:20px;padding:4px 12px;backdrop-filter:blur(6px);
    display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:12px}
  .pill b{color:#ffd166;font-weight:700}
  #phasePill{border-color:rgba(255,180,80,.5)}
  #phasePill.danger{border-color:#ff4d4d;color:#ff8080;animation:pulse .6s infinite}
  @keyframes pulse{50%{background:rgba(120,20,20,.8)}}
  #spacer{flex:1}
  #hud .pill{pointer-events:auto}
  #pauseBtn{cursor:pointer;user-select:none}
  #pauseBtn:hover{border-color:rgba(120,210,255,.85)}

  /* 工具列 */
  #toolbar{position:absolute;bottom:0;left:0;right:0;height:80px;
    padding:5px 8px;display:flex;gap:10px;align-items:stretch;
    background:linear-gradient(to top,#070e16,#0a1520);
    border-top:1px solid rgba(60,120,170,.3)}
  .group{display:flex;gap:5px;flex-wrap:wrap;align-content:flex-start}
  #builds{width:700px}
  #skills{width:240px;border-left:1px solid rgba(60,120,170,.2);padding-left:10px}
  .btn{background:rgba(16,30,44,.92);border:1px solid rgba(80,150,210,.3);
    border-radius:6px;padding:3px 4px;width:72px;height:34px;cursor:pointer;
    color:#cfe4f5;font-size:9.5px;text-align:center;transition:.1s;
    user-select:none;position:relative;overflow:hidden;line-height:1.2}
  .btn:hover{border-color:rgba(120,210,255,.85);background:rgba(26,50,72,.95);
    transform:translateY(-1px)}
  .btn.sel{border-color:#4fd8ff;background:rgba(28,84,124,.95);
    box-shadow:0 0 10px rgba(80,216,255,.55)}
  .btn.locked{opacity:.32;cursor:not-allowed;transform:none!important}
  #app.paused .btn{cursor:not-allowed}
  .btn .nm{font-weight:700;font-size:10px;color:#eaf6ff;display:block;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .btn .cost{color:#ffd166;font-size:9px;display:block}
  .btn .key{position:absolute;top:0px;right:2px;font-size:7.5px;color:#5a7a95}
  .cdmask{position:absolute;inset:0;background:rgba(0,0,0,.72);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:14px;font-weight:700;pointer-events:none}

  /* 開場 / 結算 */
  #overlay{position:absolute;inset:0;background:rgba(4,10,18,.95);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;text-align:center;color:#dceaf5;z-index:50;padding:24px;
    backdrop-filter:blur(4px)}
  #overlay h1{font-size:42px;letter-spacing:10px;
    background:linear-gradient(180deg,#8ee7ff,#1a7fc4);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:900;filter:drop-shadow(0 0 24px rgba(60,180,255,.5))}
  #overlay h2{font-size:20px;letter-spacing:3px;color:#ffd166}
  #overlay p{font-size:12.5px;line-height:1.9;color:#8fb3cc;max-width:620px}
  #overlay .hi{color:#5fd4ff;font-weight:700}
  #overlay .warn{color:#ff8a5c;font-weight:700}
  #startBtn,.langBtn{margin-top:6px;padding:10px 40px;font-size:15px;letter-spacing:3px;
    border:1px solid #4fd8ff;border-radius:30px;background:rgba(20,70,110,.6);
    color:#dff4ff;cursor:pointer;transition:.15s;font-weight:700}
  #startBtn:hover,.langBtn:hover{background:rgba(40,140,200,.85);box-shadow:0 0 30px rgba(80,216,255,.6);
    transform:scale(1.05)}
  #overlay.hidden{display:none}
  .langs{display:flex;gap:14px;margin-top:6px}
  #langLink{margin-top:4px;font-size:11.5px;color:#5a7a95;cursor:pointer;text-decoration:underline}

  #toast{position:absolute;top:56px;left:50%;transform:translateX(-50%);
    background:rgba(20,60,90,.92);border:1px solid #5fd4ff;border-radius:8px;
    padding:5px 16px;color:#dff4ff;font-size:12px;opacity:0;pointer-events:none;
    transition:opacity .25s;white-space:nowrap;z-index:40}
  #toast.show{opacity:1}

  /* 提示 */
  #tip{position:absolute;z-index:45;max-width:250px;padding:6px 10px;
    background:rgba(8,18,28,.95);border:1px solid rgba(95,212,255,.6);border-radius:6px;
    color:#cfe4f5;font-size:11px;line-height:1.65;pointer-events:none;display:none}
  #tip b{color:#ffd166}
  #tip .t{display:block;font-weight:700;color:#eaf6ff;font-size:12px}
</style>
</head>
<body>
<div id="app">
  <canvas id="game" width="960" height="520"></canvas>

  <div id="hud">
    <div class="pill" data-tip="mats"><span>🪵</span><b id="mats">0</b></div>
    <div class="pill" id="powerPill" data-tip="power"><span>⚡</span><b id="powerTxt">0/0</b></div>
    <div class="pill" data-tip="trucks"><span>🚛</span><b id="unitTxt">0</b></div>
    <div class="pill" id="phasePill" data-tip="phase"><span id="phaseTxt"></span></div>
    <div class="pill" data-tip="phase"><span id="timerTxt">45s</span></div>
    <div id="spacer"></div>
    <div class="pill" data-tip="wave"><span id="waveTxt"></span></div>
    <div class="pill" id="pauseBtn" data-tip="pause">⏸</div>
  </div>

  <div id="toolbar">
    <div class="group" id="builds"></div>
    <div class="group" id="skills"></div>
  </div>

  <div id="toast"></div>
  <div id="tip"></div>

  <div id="overlay"></div>
</div>

<script src="lang/zh-Hant.js"></script>
<script src="lang/en.js"></script>
<script>
(() => {
"use strict";

/* ══════════════ 常數 ══════════════ */
const COLS = 32, ROWS = 16;
const TX = 30, TY = 24;              // 格子像素尺寸（水平 / 垂直）
const WORLD_X = 0, WORLD_Y = 56;     // 世界在畫布中的偏移
const W = COLS * TX;                 // 960
const H = ROWS * TY;                 // 384

const WATER_MAX = 1.4;
const FLOW_INTERVAL = 0.075;         // 每 75ms 一步水流
const HOME = { x: 1, y: 8, w: 3, h: 4 };
const LOSE_DEPTH = 0.55;             // 家前水深刻度即失敗
const SURGE_WARN = 3;                // 後續湧浪到達前幾秒（實際時間）出警告
const TSUNAMI_MAX = 12;             // 停止注水後最多再等的波次進度
const SEEP_KEEP = 0.7;               // 湧浪之間及之後每秒保留的水量比例
const DRAIN_KEEP = 0.35;             // 退水階段每秒保留的水量比例
const FLOW_RATE = 0.55;              // 每步流向下一格的水量比例
const WATER_EPS = 0.008;             // 低於此水深視為乾涸
const START_MATS = 80;               // 開局材料
const BASE_INCOME = 3;               // 準備階段每秒基本收入

const DEFS = {
  sandbag:   { cost:14,  hp:400,  block:true, size:1, color:'#c9a86a', h:6,  key:'1' },
  tree:      { cost:22,  hp:650,  block:true, size:1, color:'#3e8a3e', h:16, key:'2' },
  wall:      { cost:26,  hp:900,  block:true, size:1, color:'#8c8c96', h:12, key:'3' },
  dike:      { cost:45,  hp:1900, block:true, size:1, color:'#b4b4be', h:18, key:'4' },
  mg:        { cost:30,  hp:150,  block:true, size:1, color:'#6a7a6a', h:20, key:'5', tower:'mg',     range:3.6, dmg:1.2, cd:0.14 },
  rocket:    { cost:60,  hp:180,  block:true, size:1, color:'#8a6a5a', h:22, key:'6', tower:'rocket', range:4.5, dmg:1.4, cd:0.5 },
  frost:     { cost:55,  hp:140,  block:true, size:1, color:'#5a9aca', h:20, key:'7', tower:'frost',  range:3.2, dmg:0.8 },
  dump:      { cost:50,  hp:200,  block:true, size:2, color:'#6a7a5a', h:10, key:'8', producer:true },
  power:     { cost:70,  hp:220,  block:true, size:2, color:'#4a7aa8', h:16, key:'9', power:30 },
  recycle:   { cost:40,  hp:160,  block:true, size:2, color:'#3f8f6a', h:8,  key:'0', income:2 },
  tech:      { cost:150, hp:400,  block:true, size:2, color:'#7a5a9a', h:26, key:'T' },
  superbase: { cost:300,hp:500, block:true, size:2, color:'#a05050', h:30, key:'Y' },
};

const SUPER = { cd:45, radius:6 };
const MAX_TRUCKS = 5;

// pulses：每波的湧浪 { at 開始, dur 長度, power 強度 }，at/dur 以波次進度計（遊戲時間 × speed）
const WAVES = [
  { speed:1.0, prep:45, pulses:[{at:0,dur:8,power:1.0}] },
  { speed:1.1, prep:38, pulses:[{at:0,dur:7,power:1.1}, {at:12,dur:5,power:0.8}] },
  { speed:1.2, prep:34, pulses:[{at:0,dur:5,power:0.8}, {at:9,dur:8,power:1.3}, {at:22,dur:5,power:0.8}] },
  { speed:1.3, prep:32, pulses:[{at:0,dur:6,power:0.9}, {at:10,dur:6,power:1.0}, {at:20,dur:10,power:1.3}] },
  { speed:1.4, prep:30, pulses:[{at:0,dur:7,power:1.0}, {at:11,dur:12,power:1.4}, {at:27,dur:9,power:0.9}] },
];
// 海灣：從第 2 波起，每波的注水集中在以隨機一列為中心的平滑隆起
const BAY_PEAK = 1.5;    // 中心列倍率上限
const BAY_FLOOR = 0.7;   // 遠離中心列倍率下限
const BAY_WIDTH = 2.5;   // 隆起寬度（列，高斯標準差）
// 小型可設種子亂數（mulberry32），不用 Math.random，令同一種子得同一組海灣
function seededRng(seed){
  let a = seed >>> 0;
  return () => {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
// 以中心列 c 建立每列倍率：平均為 1，最高不超過 BAY_PEAK，最低不低於 BAY_FLOOR
function bayProfile(c){
  const bump = Array.from({length:ROWS}, (_, y) => Math.exp(-0.5 * ((y - c) / BAY_WIDTH) ** 2));
  const mean = bump.reduce((a, b) => a + b, 0) / ROWS;
  const hi = Math.max(...bump) - mean, lo = mean - Math.min(...bump);
  const k = Math.min((BAY_PEAK - 1) / hi, (1 - BAY_FLOOR) / lo);
  return bump.map(b => 1 + k * (b - mean));
}
// 由本局種子得出每波的每列倍率；第 1 波平坦
function rollBays(seed){
  const rng = seededRng(seed);
  return WAVES.map((_, w) => {
    const c = Math.floor(rng() * ROWS);
    return w === 0 ? new Array(ROWS).fill(1) : bayProfile(c);
  });
}
// 最後一道湧浪結束的進度
const inflowEndOf = w => Math.max(...w.pulses.map(s => s.at + s.dur));
// 進度 p 時正在注水的湧浪索引（無則 -1）
const pulseIndexAt = (w, p) => w.pulses.findIndex(s => p >= s.at && p <= s.at + s.dur);
// 進度 p 之後下一道湧浪的索引（無則 -1）
const nextPulseIndex = (w, p) => w.pulses.findIndex(s => s.at > p);

// 測試旗標：test/waves.test.mjs 在載入前設定 window.__TSUNAMI_TEST__ = { noLose? }
const TEST = window.__TSUNAMI_TEST__ || null;

/* ══════════════ 狀態 ══════════════ */
const G = {
  phase:'menu', wave:0, timer:0, paused:false,
  materials:80, power:{prod:0,cons:0,ok:true},
  water:new Float32Array(COLS*ROWS),
  freeze:new Float32Array(COLS*ROWS),
  grid:[],
  structures:[], trucks:[], city:[],
  particles:[], projectiles:[], effects:[],
  boxes:[],
  selectedBuild:null, selectedSkill:null,
  flowTimer:0,
  incomeAcc:0, boxTimer:0,
  shake:0, time:0,
  waveProgress:0, inflowEnd:0,
  pulseIdx:-1,     // 本幀正在注水的湧浪（-1 = 沒有）；注水與 HUD 共用
  warnedIdx:0,     // 已出警告的最後一道湧浪
  seed:0,          // 本局種子（開局時決定）
  bays:[],         // 每波的每列倍率（由 seed 得出）
  techUnlocked:false, superUnlocked:false,
  superCD:0,
  superAim:false,
  toastTimer:null,
};

/* ══════════════ 畫布 ══════════════ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const app = document.getElementById('app');

const groundCanvas = document.createElement('canvas');
groundCanvas.width = W; groundCanvas.height = H;
const gctx = groundCanvas.getContext('2d');

/* ══════════════ 工具函數 ══════════════ */
const idx = (x,y) => y*COLS + x;

function shade(hex, amt){
  const n = parseInt(hex.slice(1),16);
  let r = (n>>16)&255, g = (n>>8)&255, b = n&255;
  if(amt > 0){ r += (255-r)*amt; g += (255-g)*amt; b += (255-b)*amt; }
  else { r *= (1+amt); g *= (1+amt); b *= (1+amt); }
  return `rgb(${r|0},${g|0},${b|0})`;
}

function spawnParticles(x,y,n,color,speed){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2;
    const s = speed*(0.3+Math.random());
    G.particles.push({
      x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s - 40,
      life: 0.5+Math.random()*0.6, max: 0.5+Math.random()*0.6,
      color, size: 2+Math.random()*3,
    });
  }
}

/* ══════════════ 地面預渲染 ══════════════ */
function renderGround(){
  for(let x=0;x<COLS;x++){
    for(let y=0;y<ROWS;y++){
      let r,g,b;
      if(x<=4){ r=36; g=60; b=38; }
      else if(x<=26){ r=46; g=46; b=53; }
      else { r=116; g=100; b=70; }
      const n = (Math.random()-0.5)*14;
      gctx.fillStyle = `rgb(${r+n|0},${g+n|0},${b+n|0})`;
      gctx.fillRect(x*TX, y*TY, TX, TY);
    }
  }
  gctx.fillStyle = 'rgba(26,26,32,0.5)';
  for(let y=2;y<ROWS;y+=6) gctx.fillRect(5*TX, y*TY, 22*TX, 7);
  for(let x=8;x<26;x+=7) gctx.fillRect(x*TX, 0, 7, H);

  gctx.strokeStyle = 'rgba(0,0,0,0.12)';
  gctx.lineWidth = 1;
  for(let x=0;x<=COLS;x++){ gctx.beginPath(); gctx.moveTo(x*TX+.5,0); gctx.lineTo(x*TX+.5,H); gctx.stroke(); }
  for(let y=0;y<=ROWS;y++){ gctx.beginPath(); gctx.moveTo(0,y*TY+.5); gctx.lineTo(W,y*TY+.5); gctx.stroke(); }

  const grd = gctx.createLinearGradient(26*TX,0,28*TX,0);
  grd.addColorStop(0,'rgba(120,180,220,0)');
  grd.addColorStop(1,'rgba(120,180,220,0.16)');
  gctx.fillStyle = grd;
  gctx.fillRect(26*TX,0,2*TX,H);
}

/* ══════════════ 初始化 ══════════════ */
function init(){
  G.grid = [];
  for(let x=0;x<COLS;x++){
    G.grid[x] = [];
    for(let y=0;y<ROWS;y++) G.grid[x][y] = null;
  }
  G.structures = []; G.trucks = []; G.city = [];
  G.particles = []; G.projectiles = []; G.effects = []; G.boxes = [];
  G.water.fill(0); G.freeze.fill(0);
  G.waveProgress = 0;

  for(let i=0;i<55;i++){
    const bx = 5 + Math.floor(Math.random()*22);
    const by = Math.floor(Math.random()*13);
    const hgt = 1 + Math.floor(Math.random()*3);
    if(by + hgt > ROWS-1) continue;
    G.city.push({ x:bx, y:by, h:hgt, destroyed:false,
      shade: 58 + Math.random()*50 });
  }
}

/* ══════════════ 語言 ══════════════ */
// 語言檔在 lang/*.js，載入時註冊到 window.TSUNAMI_LANGS
const STR = {};
for(const [k, make] of Object.entries(window.TSUNAMI_LANGS))
  STR[k] = make({ SUPER, WAVES, BASE_INCOME, MAX_TRUCKS, LOSE_DEPTH });

const LANG_KEY = 'tsunami.lang';
function savedLang(){
  try { const v = localStorage.getItem(LANG_KEY); return STR[v] ? v : null; } catch(e){ return null; }
}
let LANG = savedLang() || 'zh-Hant';
function L(){ return STR[LANG]; }
function bname(id){ return L().names[id]; }
function applyLang(lang){
  LANG = lang;
  document.documentElement.lang = lang;
  document.title = L().title;
  buildUI();
  updateUI();
}
// 玩家選擇語言時才記住
function setLang(lang){
  try { localStorage.setItem(LANG_KEY, lang); } catch(e){}
  applyLang(lang);
}

/* ══════════════ 開始畫面 ══════════════ */
function showMenu(){
  const ov = document.getElementById('overlay');
  ov.classList.remove('hidden');
  ov.innerHTML = `<h1>${L().menuH1}</h1><h2>${L().menuH2}</h2><p>${L().menuP()}</p>
    <button id="startBtn">${L().start}</button>
    <div id="langLink">${L().changeLang}</div>`;
  document.getElementById('startBtn').onclick = () => savedLang() ? startGame() : showLangPicker();
  document.getElementById('langLink').onclick = showLangPicker;
}

// 第一次開始遊戲時詢問語言；之後記住選擇
function showLangPicker(){
  const ov = document.getElementById('overlay');
  ov.innerHTML = `<h2>${L().pickLang}</h2>
    <div class="langs">${Object.entries(STR).map(([k, s]) =>
      `<button class="langBtn" data-lang="${k}">${s.langName}</button>`).join('')}</div>`;
  ov.querySelectorAll('.langBtn').forEach(b => {
    b.onclick = () => { setLang(b.dataset.lang); showMenu(); };
  });
}

/* ══════════════ 遊戲流程 ══════════════ */
let nextSeed = null;  // 測試用：下一局的種子
function startGame(){
  init();
  G.phase = 'prep';
  G.wave = 0;
  togglePause(false);
  // 本局種子：測試可先以 setSeed 指定，否則隨機
  G.seed = nextSeed != null ? nextSeed : Math.floor(Math.random() * 4294967296);
  nextSeed = null;
  G.bays = rollBays(G.seed);
  G.materials = START_MATS;
  G.timer = WAVES[0].prep;
  G.incomeAcc = 0; G.boxTimer = 0;
  G.shake = 0;
  G.selectedBuild = null; G.selectedSkill = null;
  G.techUnlocked = false; G.superUnlocked = false;
  G.superCD = 0; G.superAim = false;
  document.getElementById('overlay').classList.add('hidden');
  updateUI();
}

function startWave(){
  const w = WAVES[G.wave];
  G.phase = 'tsunami';
  G.waveProgress = 0;
  G.waveSpeed = w.speed;
  G.inflowEnd = inflowEndOf(w);
  G.pulseIdx = pulseIndexAt(w, 0); G.warnedIdx = 0;  // 每波重設；進度 0 時第一道湧浪已在注水
  G.boxes.length = 0;
  G.shake = 8;
  toast(L().tWaveIncoming(G.wave+1), true);
  updateUI();
}

function endGame(win){
  G.phase = win ? 'win' : 'lose';
  const ov = document.getElementById('overlay');
  ov.classList.remove('hidden');
  ov.innerHTML = win
    ? `<h1>${L().winH1}</h1><h2 style="color:#5fd4ff">${L().winH2}</h2>
       <p>${L().winP(Math.floor(G.materials))}</p>
       <button id="startBtn">${L().again}</button>`
    : `<h1 style="background:linear-gradient(180deg,#ff9a9a,#a01515);
        -webkit-background-clip:text;background-clip:text">${L().loseH1}</h1>
       <h2 style="color:#ff6b6b">${L().loseH2}</h2>
       <p>${L().loseP(G.wave+1)}</p>
       <button id="startBtn">${L().retry}</button>`;
  document.getElementById('startBtn').onclick = () => { startGame(); };
}

// 第一道之後的每道湧浪：到達前約 SURGE_WARN 秒（實際時間）出警告提示，到達時震動畫面。
// 警告只在間隔中出現（上一道湧浪仍在注水時延到間隔開始），每道只出一次；
// 提示的秒數按實際出警告時剩餘的時間計算，與 HUD 倒數一致。
function surgeCues(w, p0, p1){
  for(let k = 1; k < w.pulses.length; k++){
    const at = w.pulses[k].at;
    if(k > G.warnedIdx && G.pulseIdx < 0 && p0 < at && p0 >= at - SURGE_WARN * G.waveSpeed){
      G.warnedIdx = k;
      toast(L().tSurgeWarn(k+1, Math.max(1, Math.ceil((at - p1) / G.waveSpeed))), true);
    }
    if(p0 < at && p1 >= at) G.shake = Math.max(G.shake, 8);
  }
}

/* ══════════════ 水體模擬 ══════════════ */
function updateWater(dt){
  // 海嘯階段：湧浪期間從右側注入；強度 > 1 的湧浪提高注水上限（最多至滿水深）
  G.pulseIdx = G.phase === 'tsunami' ? pulseIndexAt(WAVES[G.wave], G.waveProgress) : -1;
  const pulse = G.pulseIdx >= 0 ? WAVES[G.wave].pulses[G.pulseIdx] : null;
  if(pulse){
    // 以 60fps 為基準按 dt 縮放，令注水量不受幀率影響
    // 每列強度 = 湧浪強度 × 海灣倍率；同時決定注水速度與上限
    const bay = G.bays[G.wave];
    for(let y=0;y<ROWS;y++){
      const power = pulse.power * bay[y];
      const injectRate = 0.55 * G.waveSpeed * power * dt * 60;
      // 注水上限：強度 ≤ 1 為 92%，之後平滑上升（1.1→94%、1.3→98%、1.4 起滿水深）
      const cap = WATER_MAX * (power <= 1 ? 0.92 : Math.min(1, 0.92 + (power - 1) * 0.2));
      const i = idx(COLS-1, y);
      if(G.water[i] < cap){
        G.water[i] = Math.min(cap, G.water[i] + injectRate);
      }
    }
  }
  if(G.phase === 'tsunami'){
    const p0 = G.waveProgress;
    G.waveProgress += dt * G.waveSpeed;
    surgeCues(WAVES[G.wave], p0, G.waveProgress);
    // 滲水：湧浪之間及最後一道湧浪後，積水緩慢消退
    if(!pulse) decayWater(SEEP_KEEP, dt);
  }
  // 退水
  if(G.phase === 'drain') decayWater(DRAIN_KEEP, dt);
  // 冰凍計時
  for(let i=0;i<G.freeze.length;i++){
    if(G.freeze[i] > 0) G.freeze[i] = Math.max(0, G.freeze[i]-dt);
  }
  // 流動步進
  G.flowTimer += dt;
  while(G.flowTimer >= FLOW_INTERVAL){
    G.flowTimer -= FLOW_INTERVAL;
    flowStep();
  }
}

// 每秒保留 keep 比例的水；凍結格不變
function decayWater(keep, dt){
  const k = Math.pow(keep, dt);
  for(let i=0;i<G.water.length;i++){
    if(G.freeze[i] > 0) continue;
    G.water[i] *= k;
    if(G.water[i] < WATER_EPS) G.water[i] = 0;
  }
}

function flowStep(){
  const nw = new Float32Array(G.water.length);
  nw.set(G.water);

  // 左邊界：水流出地圖
  for(let y=0;y<ROWS;y++){
    const i = idx(0,y);
    if(G.freeze[i] > 0) continue;
    nw[i] -= G.water[i] * FLOW_RATE;
  }

  for(let x=COLS-1;x>=1;x--){
    for(let y=0;y<ROWS;y++){
      const i = idx(x,y);
      if(G.freeze[i] > 0) continue;
      const h = G.water[i];
      if(h < 0.02) continue;

      const transfer = h * FLOW_RATE;
      if(transfer < 0.004) continue;

      const left = G.grid[x-1][y];
      const leftI = idx(x-1,y);

      if(!left && G.freeze[leftI] <= 0){
        // 暢通 → 向左流
        const space = WATER_MAX - G.water[leftI];
        const amt = Math.min(transfer, space);
        if(amt > 0){
          nw[leftI] += amt;
          nw[i] -= amt;
        }
      } else if(left){
        // 撞擊障礙 → 損傷 + 側向漫流
        left.hp -= h * 1.6;
        if(left.hp <= 0) destroyEntity(left);

        let remaining = transfer;
        for(const dy of [-1,1]){
          const ny = y + dy;
          if(ny < 0 || ny >= ROWS) continue;
          if(G.grid[x-1][ny]) continue;
          const ni = idx(x-1, ny);
          if(G.freeze[ni] > 0) continue;
          const space = WATER_MAX - G.water[ni];
          const amt = Math.min(remaining * 0.55, space);
          if(amt > 0){
            nw[ni] += amt;
            nw[i] -= amt;
            remaining -= amt;
          }
        }
      }
    }
  }
  G.water = nw;
}

/* ══════════════ 實體管理 ══════════════ */
function inHome(x,y){
  return x >= HOME.x && x < HOME.x+HOME.w && y >= HOME.y && y < HOME.y+HOME.h;
}

function canPlace(def, gx, gy){
  for(let dx=0;dx<def.size;dx++) for(let dy=0;dy<def.size;dy++){
    const x = gx+dx, y = gy+dy;
    if(x<0 || x>=COLS || y<0 || y>=ROWS) return false;
    if(G.grid[x][y]) return false;
    if(inHome(x,y)) return false;
  }
  return true;
}

function placeEntity(defId, gx, gy){
  const def = DEFS[defId];
  if(!def) return false;
  if(G.materials < def.cost){ toast(L().tNoMats, true); return false; }
  if(!canPlace(def, gx, gy)){ toast(L().tCantBuild); return false; }

  G.materials -= def.cost;
  const ent = {
    def, defId, gx, gy, size:def.size,
    hp:def.hp, maxHp:def.hp,
    cells:[], cd:Math.random()*0.5, prodTimer:8, pulse:0,
  };
  for(let dx=0;dx<def.size;dx++) for(let dy=0;dy<def.size;dy++){
    G.grid[gx+dx][gy+dy] = ent;
    ent.cells.push([gx+dx, gy+dy]);
  }
  G.structures.push(ent);
  spawnParticles(gx*TX + def.size*TX/2, gy*TY + def.size*TY/2, 6, def.color, 70);

  if(defId === 'tech' || defId === 'superbase') checkUnlocks();
  return true;
}

function destroyEntity(ent){
  for(const [x,y] of ent.cells){
    if(G.grid[x][y] === ent) G.grid[x][y] = null;
  }
  const i = G.structures.indexOf(ent);
  if(i >= 0) G.structures.splice(i,1);
  for(const [x,y] of ent.cells){
    spawnParticles(x*TX+TX/2, y*TY+TY/2, 4, ent.def.color, 80);
  }
  if(ent.defId === 'tech' || ent.defId === 'superbase') checkUnlocks();
}

function checkUnlocks(){
  G.techUnlocked = G.structures.some(s => s.defId === 'tech');
  G.superUnlocked = G.structures.some(s => s.defId === 'superbase');
  updateUI();
}

/* ══════════════ 防禦塔 ══════════════ */
function updateTowers(dt){
  for(const s of G.structures){
    if(!s.def.tower) continue;
    if(s.hp <= 0) continue;

    const def = s.def;
    const cx = s.gx*TX + s.size*TX/2;
    const cy = s.gy*TY + s.size*TY/2;
    const R = def.range;
    const Rg = Math.ceil(R);

    // 搜尋射程內最厚的水
    let best = null, bestH = 0.08;
    for(let dx=-Rg;dx<=Rg;dx++) for(let dy=-Rg;dy<=Rg;dy++){
      const gx = s.gx + dx, gy = s.gy + dy;
      if(gx<0 || gx>=COLS || gy<0 || gy>=ROWS) continue;
      if(Math.hypot(dx, dy) > R) continue;
      const h = G.water[idx(gx,gy)];
      if(h > bestH){ bestH = h; best = {gx, gy}; }
    }

    if(!best){ s.target = null; continue; }
    s.target = best;

    if(def.tower === 'mg'){
      s.cd -= dt;
      if(s.cd <= 0){
        s.cd += def.cd;
        const ti = idx(best.gx, best.gy);
        G.water[ti] = Math.max(0, G.water[ti] - def.dmg);
        // 彈道特效
        G.projectiles.push({
          type:'bullet',
          x1: cx, y1: cy,
          x2: best.gx*TX+TX/2, y2: best.gy*TY+TY/2,
          t: 0, dur: 0.06,
        });
        spawnParticles(best.gx*TX+TX/2, best.gy*TY+TY/2, 2, '#ffe080', 80);
      }
    }
    else if(def.tower === 'rocket'){
      s.cd -= dt;
      if(s.cd <= 0){
        s.cd += def.cd;
        G.projectiles.push({
          type:'rocket',
          x1: cx, y1: cy,
          x2: best.gx*TX+TX/2, y2: best.gy*TY+TY/2,
          t: 0, dur: 0.55,
          gx: best.gx, gy: best.gy,
        });
      }
    }
    else if(def.tower === 'frost'){
      // 持續光束：凍結並削弱
      s.beamTo = best;
      const ti = idx(best.gx, best.gy);
      G.freeze[ti] = Math.max(G.freeze[ti], 1.4);
      G.water[ti] = Math.max(0, G.water[ti] - def.dmg*dt);
    }
  }

  // 處理彈道
  for(let i=G.projectiles.length-1;i>=0;i--){
    const p = G.projectiles[i];
    p.t += dt;
    if(p.t < p.dur) continue;

    if(p.type === 'rocket'){
      // AOE 傷害
      const R = 1.7;
      for(let dx=-2;dx<=2;dx++) for(let dy=-2;dy<=2;dy++){
        if(Math.hypot(dx,dy) > R) continue;
        const gx = p.gx+dx, gy = p.gy+dy;
        if(gx<0 || gx>=COLS || gy<0 || gy>=ROWS) continue;
        const ti = idx(gx,gy);
        G.water[ti] = Math.max(0, G.water[ti] - DEFS.rocket.dmg);
      }
      G.effects.push({ type:'explosion',
        x: p.x2, y: p.y2, t:0, dur:0.4, r: R*TX });
      G.shake = Math.max(G.shake, 4);
    }
    G.projectiles.splice(i,1);
  }
}

/* ══════════════ 垃圾車 ══════════════ */
function updateTrucks(dt){
  if(G.phase === 'prep'){
    // 垃圾場生產
    if(G.power.ok && G.trucks.length < MAX_TRUCKS){
      for(const s of G.structures){
        if(s.def.producer){
          s.prodTimer -= dt;
          if(s.prodTimer <= 0 && G.trucks.length < MAX_TRUCKS){
            s.prodTimer = 14;
            s.pulse = 0.4;
            const cx = s.gx*TX + s.size*TX/2;
            const cy = s.gy*TY + s.size*TY/2;
            G.trucks.push({
              x: cx, y: cy, speed: 130, target: null,
              angle: 0,
            });
            spawnParticles(cx, cy, 4, '#d8d8d8', 60);
          }
        }
      }
    }
  }

  for(const t of G.trucks){
    // 找最近箱子
    if(!t.target || G.boxes.indexOf(t.target) < 0) t.target = null;
    if(!t.target){
      let best = null, bd = 1e9;
      for(const b of G.boxes){
        const bx = b.x*TX + TX/2, by = b.y*TY + TY/2;
        const d = Math.hypot(bx-t.x, by-t.y);
        if(d < bd){ bd = d; best = b; }
      }
      t.target = best;
    }

    if(t.target){
      const bx = t.target.x*TX + TX/2;
      const by = t.target.y*TY + TY/2;
      const dx = bx-t.x, dy = by-t.y;
      const d = Math.hypot(dx,dy);
      t.angle = Math.atan2(dy,dx);
      if(d < 10){
        const amt = 10 + Math.floor(Math.random()*8);
        G.materials += amt;
        spawnParticles(bx, by, 6, '#ffd166', 100);
        const bi = G.boxes.indexOf(t.target);
        if(bi >= 0) G.boxes.splice(bi,1);
        t.target = null;
      } else {
        const step = Math.min(t.speed*dt, d);
        t.x += dx/d*step;
        t.y += dy/d*step;
      }
    }
  }
}

/* ══════════════ 主更新 ══════════════ */
function update(dt){
  G.time += dt;
  if(G.shake > 0) G.shake = Math.max(0, G.shake - dt*40);
  if(G.superCD > 0) G.superCD = Math.max(0, G.superCD - dt);

  // 粒子
  for(let i=G.particles.length-1;i>=0;i--){
    const p = G.particles[i];
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vy += 320*dt;
    p.life -= dt;
    if(p.life <= 0) G.particles.splice(i,1);
  }
  // 特效
  for(let i=G.effects.length-1;i>=0;i--){
    const e = G.effects[i];
    e.t += dt;
    if(e.t > e.dur) G.effects.splice(i,1);
  }
  // 建築脈動
  for(const s of G.structures) if(s.pulse > 0) s.pulse = Math.max(0, s.pulse - dt);

  // 電力
  calcPower();

  updateWater(dt);
  updateTowers(dt);
  updateTrucks(dt);

  // 階段邏輯
  if(G.phase === 'prep'){
    G.timer -= dt;
    G.incomeAcc += dt;
    while(G.incomeAcc >= 1){
      G.incomeAcc -= 1;
      let inc = BASE_INCOME;
      for(const s of G.structures){
        if(s.def.income) inc += s.def.income * (G.power.ok ? 1 : 0.5);
      }
      G.materials += inc;
    }

    G.boxTimer += dt;
    if(G.boxTimer > 1.2){ G.boxTimer = 0; spawnBox(); }
    for(let i=G.boxes.length-1;i>=0;i--){
      G.boxes[i].life -= dt;
      if(G.boxes[i].life <= 0) G.boxes.splice(i,1);
    }

    if(G.timer <= 0) startWave();
  }
  else if(G.phase === 'tsunami'){
    // 檢查家前水深
    let homeDanger = 0;
    for(let x=HOME.x; x<HOME.x+HOME.w; x++){
      for(let y=HOME.y; y<HOME.y+HOME.h; y++){
        homeDanger = Math.max(homeDanger, G.water[idx(x,y)]);
      }
    }
    if(homeDanger > LOSE_DEPTH && !(TEST && TEST.noLose)){
      G.phase = 'lose';
      G.shake = 30;
      setTimeout(()=>endGame(false), 800);
      return;
    }

    // 判斷波次結束：水源結束且水退去，或超時
    const totalWater = G.water.reduce((a,b)=>a+b, 0);
    if(G.waveProgress > G.inflowEnd && (totalWater < 3 || G.waveProgress > G.inflowEnd + TSUNAMI_MAX)){
      G.phase = 'drain';
      G.drainT = 0;
    }
  }
  else if(G.phase === 'drain'){
    G.drainT = (G.drainT || 0) + dt;
    const totalWater = G.water.reduce((a,b)=>a+b, 0);
    if(totalWater < 0.6 || G.drainT > 6){
      G.wave++;
      if(G.wave >= WAVES.length){
        G.phase = 'win';
        setTimeout(()=>endGame(true), 500);
      } else {
        G.phase = 'prep';
        G.timer = WAVES[G.wave].prep;
        G.boxTimer = 0;
        G.water.fill(0);
        G.freeze.fill(0);
        toast(L().tNextWave(G.wave+1, WAVES[G.wave].prep), true);
      }
    }
  }

  updateUI();
}

function calcPower(){
  let prod = 0, cons = 0;
  for(const s of G.structures){
    const p = powerOf(s.defId);
    if(p > 0) prod += p; else cons -= p;
  }
  G.power.prod = prod;
  G.power.cons = cons;
  G.power.ok = cons <= prod;
}

/* ══════════════ 物資箱 ══════════════ */
function spawnBox(){
  for(let tries=0; tries<24; tries++){
    const x = Math.floor(Math.random()*COLS);
    const y = Math.floor(Math.random()*ROWS);
    if(G.grid[x][y]) continue;
    if(inHome(x,y)) continue;
    if(G.boxes.some(b=>b.x===x && b.y===y)) continue;
    G.boxes.push({ x, y, life:18, t:Math.random()*6 });
    return;
  }
}

/* ══════════════ 輸入處理 ══════════════ */
const mouse = { x:-999, y:-999, gx:-1, gy:-1 };

function toWorld(e){
  const r = canvas.getBoundingClientRect();
  const sx = canvas.width / r.width;
  const sy = canvas.height / r.height;
  return {
    x: (e.clientX - r.left) * sx,
    y: (e.clientY - r.top) * sy - WORLD_Y,
  };
}

canvas.addEventListener('pointermove', e => {
  const p = toWorld(e);
  mouse.x = p.x; mouse.y = p.y;
  mouse.gx = Math.floor(p.x / TX);
  mouse.gy = Math.floor(p.y / TY);
});

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  const p = toWorld(e);
  mouse.x = p.x; mouse.y = p.y;
  const gx = Math.floor(p.x / TX);
  const gy = Math.floor(p.y / TY);
  if(gx<0 || gx>=COLS || gy<0 || gy>=ROWS) return;

  if(G.phase === 'menu' || G.phase === 'win' || G.phase === 'lose') return;
  if(G.paused) return;

  // 1. 撿箱子
  for(let i=0;i<G.boxes.length;i++){
    const b = G.boxes[i];
    if(b.x === gx && b.y === gy){
      const amt = 10 + Math.floor(Math.random()*8);
      G.materials += amt;
      spawnParticles(gx*TX+TX/2, gy*TY+TY/2, 6, '#ffd166', 100);
      toast(L().tMats(amt));
      G.boxes.splice(i,1);
      return;
    }
  }

  // 2. 超級武器瞄準
  if(G.superAim){
    if(!G.superUnlocked){ toast(L().tSuperLocked, true); return; }
    if(G.superCD > 0){ toast(L().tCooldown(Math.ceil(G.superCD)), true); return; }
    fireSuper(gx, gy);
    G.superAim = false;
    updateUI();
    return;
  }

  // 3. 建造
  if(G.selectedBuild){
    placeEntity(G.selectedBuild, gx, gy);
    return;
  }
});

canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  G.selectedBuild = null;
  G.superAim = false;
  updateUI();
});

window.addEventListener('keydown', e => {
  const k = e.key.toUpperCase();
  if((k === 'P' || e.key === ' ') && canPause()){ e.preventDefault(); togglePause(); return; }
  if(G.paused) return;
  for(const id in DEFS){
    if(DEFS[id].key === k){
      if(id === 'superbase' && !G.techUnlocked){ toast(L().tNeedTech, true); return; }
      G.selectedBuild = G.selectedBuild === id ? null : id;
      G.superAim = false;
      updateUI();
      return;
    }
  }
  if(k === 'R'){ // 超級武器快捷鍵
    if(G.superUnlocked && G.superCD <= 0){
      G.superAim = true; G.selectedBuild = null; updateUI();
    }
  }
  if(e.key === 'Escape'){
    G.selectedBuild = null;
    G.superAim = false;
    updateUI();
  }
});

/* ══════════════ 提示 ══════════════ */
// 供電為正、耗電為負
function powerOf(id){
  const d = DEFS[id];
  if(d.power) return d.power;
  if(d.tower) return -3;
  if(d.producer || d.income) return -5;
  if(id === 'tech') return -10;
  if(id === 'superbase') return -15;
  return 0;
}

function defTip(id, ent){
  const d = DEFS[id], pw = powerOf(id), T = L();
  const hp = ent ? `${Math.ceil(ent.hp)} / ${ent.maxHp}` : d.hp;
  const st = [`${T.cost} <b>${d.cost}</b>`, `${T.hp} <b>${hp}</b>`];
  if(d.size === 2) st.push(T.size2);
  if(pw > 0) st.push(`${T.supply} <b>+${pw}</b>`);
  else if(pw < 0) st.push(`${T.use} <b>${-pw}</b>`);
  const lines = [`<span class="t">${bname(id)}</span>${T.role[id]}`, st.join(' · ')];
  if(d.tower === 'frost') lines.push(T.frostStats(d));
  else if(d.tower) lines.push(T.towerStats(d));
  if(!ent && d.key) lines.push(T.hotkey(d.key));
  return lines.join('<br>');
}

function tipFor(key){
  if(key.startsWith('b:')) return defTip(key.slice(2));
  const T = L(), w = WAVES[Math.min(G.wave, WAVES.length-1)];
  switch(key){
    case 'mats':   return T.tipMats(Math.floor(G.materials));
    case 'power':  return T.tipPower(G.power);
    case 'trucks': return T.tipTrucks(G.trucks.length);
    case 'phase':  return T.tipPhase;
    case 'wave':   return T.tipWave(Math.min(G.wave+1, WAVES.length), w);
    case 'super':  return T.tipSuper();
    case 'pause':  return T.tipPause(G.paused);
  }
  return '';
}

// 地圖上的提示（只在暫停時顯示）
function worldTip(gx, gy){
  if(gx<0 || gx>=COLS || gy<0 || gy>=ROWS) return '';
  const ent = G.grid[gx][gy];
  if(ent) return defTip(ent.defId, ent);
  const box = G.boxes.find(b => b.x === gx && b.y === gy);
  if(box) return L().tipBox(Math.ceil(box.life));
  const h = G.water[idx(gx,gy)];
  if(inHome(gx,gy)) return L().tipHome(h.toFixed(2));
  if(h > 0.02) return L().tipWater(h.toFixed(2), G.freeze[idx(gx,gy)] > 0);
  return '';
}

const tipEl = document.getElementById('tip');
function showTip(html, x, y){
  tipEl.innerHTML = html;
  tipEl.style.display = 'block';
  const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  tipEl.style.left = Math.max(4, Math.min(x + 14, 960 - w - 4)) + 'px';
  tipEl.style.top = (y + 14 + h > 516 ? y - h - 10 : y + 14) + 'px';
}
function hideTip(){ tipEl.style.display = 'none'; }

app.addEventListener('pointermove', e => {
  const r = app.getBoundingClientRect(), s = r.width / 960;
  const x = (e.clientX - r.left) / s, y = (e.clientY - r.top) / s;
  const t = e.target.closest('[data-tip]');
  const html = t ? tipFor(t.dataset.tip)
    : (e.target === canvas && G.paused) ? worldTip(mouse.gx, mouse.gy) : '';
  if(html) showTip(html, x, y); else hideTip();
});
app.addEventListener('pointerleave', hideTip);

/* ══════════════ 暫停 ══════════════ */
function canPause(){
  return G.phase === 'prep' || G.phase === 'tsunami' || G.phase === 'drain';
}
function togglePause(force){
  if(!canPause()) return;
  G.paused = force !== undefined ? force : !G.paused;
  document.getElementById('pauseBtn').textContent = G.paused ? '▶' : '⏸';
  app.classList.toggle('paused', G.paused);
  hideTip();
}
document.getElementById('pauseBtn').onclick = () => togglePause();
document.addEventListener('visibilitychange', () => {
  if(document.hidden) togglePause(true);
});

/* ══════════════ 超級武器 ══════════════ */
function fireSuper(gx, gy){
  G.superCD = SUPER.cd;
  const R = SUPER.radius;

  for(let dx=-R;dx<=R;dx++) for(let dy=-R;dy<=R;dy++){
    if(Math.hypot(dx,dy) > R) continue;
    const x = gx+dx, y = gy+dy;
    if(x<0 || x>=COLS || y<0 || y>=ROWS) continue;
    const i = idx(x,y);
    G.water[i] = 0;
    G.freeze[i] = Math.max(G.freeze[i], 2.5);
  }

  G.effects.push({
    type:'super',
    x: gx*TX + TX/2,
    y: gy*TY + TY/2,
    t:0, dur:1.6, r: R*TX,
  });
  G.shake = 26;
  toast(L().tSuperFire, true);
}

/* ══════════════ 提示 ══════════════ */
let toastTimer = null;
function toast(msg, warn){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.borderColor = warn ? '#ff6b6b' : '#5fd4ff';
  el.style.background = warn ? 'rgba(150,30,30,.92)' : 'rgba(20,60,90,.92)';
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 1500);
}

/* ══════════════ 渲染 ══════════════ */
function render(){
  ctx.clearRect(0,0,960,520);

  // 天空/背景
  const bgGrad = ctx.createLinearGradient(0,0,0,WORLD_Y);
  bgGrad.addColorStop(0,'#0a1220');
  bgGrad.addColorStop(1,'#0d1828');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0,0,960,WORLD_Y);

  ctx.save();
  ctx.translate(WORLD_X, WORLD_Y);
  if(G.shake > 0) ctx.translate((Math.random()-0.5)*G.shake, (Math.random()-0.5)*G.shake);

  // 世界裁剪
  ctx.beginPath();
  ctx.rect(0, -40, W, H+40);
  ctx.clip();

  ctx.drawImage(groundCanvas, 0, 0);
  drawWaterLayer();
  drawCity();
  drawHome();
  drawAllEntities();
  drawTrucks();
  drawBoxes();
  drawProjectiles();
  drawParticles();
  drawEffects();
  drawPreview();

  ctx.restore();

  // 底部陰影
  const botGrad = ctx.createLinearGradient(0,H+WORLD_Y-10,0,H+WORLD_Y+10);
  botGrad.addColorStop(0,'rgba(0,0,0,0)');
  botGrad.addColorStop(1,'rgba(0,0,0,0.5)');
  ctx.fillStyle = botGrad;
  ctx.fillRect(0,H+WORLD_Y-10,960,20);

  // 暫停畫面
  if(G.paused){
    ctx.fillStyle = 'rgba(4,10,18,0.6)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#dff4ff';
    ctx.textAlign = 'center';
    ctx.font = '700 36px sans-serif';
    ctx.fillText(L().paused, canvas.width/2, canvas.height/2);
    ctx.font = '13px sans-serif';
    ctx.fillStyle = '#8fb3cc';
    ctx.fillText(L().pausedHint, canvas.width/2, canvas.height/2 + 28);
    ctx.textAlign = 'left';
  }
}

/* --- 水體渲染 --- */
function drawWaterLayer(){
  for(let x=0;x<COLS;x++){
    for(let y=0;y<ROWS;y++){
      const i = idx(x,y);
      const w = G.water[i];
      if(w < 0.02) continue;

      const sx = x*TX, sy = y*TY;
      const depth = Math.min(w / WATER_MAX, 1);
      const alpha = Math.min(depth * 0.85, 0.85);

      // 基礎水色
      const baseR = 40 + depth*30;
      const baseG = 110 + depth*50;
      const baseB = 180 + depth*40;

      const wob = Math.sin(G.time*4 + x*0.7 + y*0.4) * 0.5 + 0.5;
      const a = alpha * (0.85 + wob * 0.15);

      ctx.fillStyle = `rgba(${baseR|0},${baseG|0},${baseB|0},${a})`;
      ctx.fillRect(sx, sy, TX+.5, TY+.5);

      // 水面高光
      if(depth > 0.4){
        ctx.fillStyle = `rgba(200,235,255,${(depth-0.4)*0.35})`;
        ctx.fillRect(sx, sy + Math.sin(G.time*3 + x*0.5)*2, TX, 2);
      }

      // 泡沫（前緣）
      if(depth > 0.15){
        const leftI = x > 0 ? idx(x-1,y) : -1;
        if(leftI < 0 || G.water[leftI] < 0.05){
          ctx.fillStyle = `rgba(230,245,255,${Math.min(depth,0.7)})`;
          ctx.fillRect(sx, sy, 3, TY);
        }
      }

      // 冰凍效果
      if(G.freeze[i] > 0){
        ctx.fillStyle = `rgba(180,230,255,0.35)`;
        ctx.fillRect(sx, sy, TX, TY);
        // 冰晶
        ctx.strokeStyle = `rgba(220,245,255,0.5)`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(sx+6, sy+6);
        ctx.lineTo(sx+14, sy+14);
        ctx.moveTo(sx+14, sy+6);
        ctx.lineTo(sx+6, sy+14);
        ctx.stroke();
      }
    }
  }
}

/* --- 城市建築 --- */
function drawCity(){
  const sorted = [...G.city].sort((a,b)=>a.y-b.y);
  for(const b of sorted){
    if(b.destroyed) continue;
    const px = b.x*TX, py = b.y*TY, ph = b.h*TY;
    const H = 8 + b.h*4;

    // 陰影
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(px+3, py+3, TX, ph);

    // 前側面
    ctx.fillStyle = `rgb(${b.shade*0.7|0},${b.shade*0.7|0},${b.shade*0.75|0})`;
    ctx.fillRect(px, py+ph-H, TX, H);

    // 頂面
    ctx.fillStyle = `rgb(${b.shade|0},${b.shade|0},${b.shade+8|0})`;
    ctx.fillRect(px, py-H, TX, ph);

    // 窗戶
    ctx.fillStyle = 'rgba(255,220,120,0.3)';
    for(let i=0;i<2;i++){
      ctx.fillRect(px+5, py+6+i*12-H, 4, 4);
      ctx.fillRect(px+18, py+6+i*12-H, 4, 4);
    }
  }
}

/* --- 家 --- */
function drawHome(){
  const px = HOME.x*TX, py = HOME.y*TY;
  const pw = HOME.w*TX, ph = HOME.h*TY;
  const H = 24;

  // 陰影
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(px+4, py+4, pw, ph);

  // 圍牆底
  ctx.fillStyle = '#4a3320';
  ctx.fillRect(px, py, pw, ph);

  // 屋身
  ctx.fillStyle = '#c49a6c';
  ctx.fillRect(px, py + ph*0.35, pw, ph*0.65);

  // 屋頂
  ctx.fillStyle = '#a3352f';
  ctx.beginPath();
  ctx.moveTo(px, py + ph*0.38);
  ctx.lineTo(px + pw/2, py - H);
  ctx.lineTo(px + pw, py + ph*0.38);
  ctx.closePath();
  ctx.fill();

  // 門窗
  ctx.fillStyle = '#5a3a1a';
  ctx.fillRect(px+pw/2-8, py+ph*0.7, 16, ph*0.3);
  ctx.fillStyle = '#ffd97a';
  ctx.fillRect(px+8, py+ph*0.55, 12, 12);
  ctx.fillRect(px+pw-20, py+ph*0.55, 12, 12);

  // 光暈
  const pulse = 0.3 + Math.sin(G.time*2) * 0.12;
  ctx.strokeStyle = `rgba(120,230,150,${pulse})`;
  ctx.lineWidth = 2;
  ctx.strokeRect(px-2, py-2, pw+4, ph+4);

  ctx.font = 'bold 10px sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'center';
  ctx.globalAlpha = 0.9;
  ctx.fillText(L().home, px+pw/2, py-H-4);
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

/* --- 所有實體（按 y 排序） --- */
function drawAllEntities(){
  const sorted = [...G.structures].sort((a,b)=>{
    const ya = a.gy + a.size, yb = b.gy + b.size;
    if(ya !== yb) return ya - yb;
    return a.gx - b.gx;
  });

  for(const e of sorted){
    drawEntity3D(e);
  }
}

function drawEntity3D(e){
  const def = e.def;
  const sx = e.gx*TX;
  const sy = e.gy*TY;
  const sw = e.size*TX;
  const sh = e.size*TY;
  const H = def.h;

  // 陰影
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(sx+3, sy+3, sw, sh);

  // 前側面
  ctx.fillStyle = shade(def.color, -0.4);
  ctx.fillRect(sx, sy + sh - H, sw, H);

  // 頂面
  ctx.fillStyle = def.color;
  ctx.fillRect(sx, sy - H, sw, sh);

  // 頂部高光
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  ctx.fillRect(sx, sy - H, sw, 2);

  // 外框
  ctx.strokeStyle = 'rgba(0,0,0,0.4)';
  ctx.lineWidth = 1;
  ctx.strokeRect(sx, sy - H, sw, sh);

  // 依類型加細節
  if(def.tower){
    drawTowerDetail(e, sx, sy, sw, sh, H);
  } else if(defId(e) === 'power'){
    drawPowerDetail(sx, sy, sw, sh, H);
  } else if(defId(e) === 'recycle'){
    drawRecycleDetail(sx, sy, sw, sh, H);
  } else if(defId(e) === 'dump'){
    drawDumpDetail(e, sx, sy, sw, sh, H);
  } else if(defId(e) === 'tech' || defId(e) === 'superbase'){
    drawTechDetail(e, sx, sy, sw, sh, H);
  }

  // HP 條
  if(e.hp < e.maxHp * 0.95){
    const bw = sw * 0.8;
    const bh = 3;
    const bx = sx + (sw-bw)/2;
    const by = sy - H - 7;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(bx-1, by-1, bw+2, bh+2);
    const ratio = Math.max(0, e.hp / e.maxHp);
    ctx.fillStyle = ratio > 0.5 ? '#4fd86a' : ratio > 0.25 ? '#ffd166' : '#ff5a5a';
    ctx.fillRect(bx, by, bw*ratio, bh);
  }
}

function defId(e){ return e.defId; }

function drawTowerDetail(e, sx, sy, sw, sh, H){
  const cx = sx + sw/2;
  const cy = sy - H + sh/2;
  const type = e.def.tower;

  if(type === 'mg'){
    // 槍管
    if(e.target){
      const t = e.target;
      const tx = t.gx*TX + TX/2;
      const ty = t.gy*TY + TY/2;
      const ang = Math.atan2(ty - (sy - H + sh/2), tx - (sx - H + sh/2));
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(ang);
      ctx.fillStyle = '#3a4a3a';
      ctx.fillRect(-2, -2, 16, 4);
      ctx.fillStyle = '#1a2a1a';
      ctx.fillRect(10, -1.5, 5, 3);
      ctx.restore();
    }
    // 塔身
    ctx.fillStyle = '#4a5a4a';
    ctx.fillRect(cx-8, cy-8, 16, 16);
    ctx.fillStyle = '#6a7a6a';
    ctx.fillRect(cx-5, cy-5, 10, 10);
  }
  else if(type === 'rocket'){
    // 發射架
    ctx.fillStyle = '#5a4a3a';
    ctx.fillRect(cx-9, cy-3, 18, 8);
    ctx.fillStyle = '#8a6a5a';
    for(let i=0;i<3;i++){
      ctx.fillRect(cx-8+i*6, cy-8, 4, 7);
    }
    // 紅點
    ctx.fillStyle = '#ff5555';
    ctx.beginPath();
    ctx.arc(cx, cy-10, 2, 0, 7);
    ctx.fill();
  }
  else if(type === 'frost'){
    // 發射器
    ctx.fillStyle = '#3a6a9a';
    ctx.beginPath();
    ctx.arc(cx, cy, 8, 0, 7);
    ctx.fill();
    ctx.fillStyle = '#7acaf0';
    ctx.beginPath();
    ctx.arc(cx, cy, 5, 0, 7);
    ctx.fill();
    // 光束
    if(e.beamTo){
      const tx = e.beamTo.gx*TX + TX/2;
      const ty = e.beamTo.gy*TY + TY/2;
      const pulse = 0.5 + Math.sin(G.time*12)*0.3;
      ctx.strokeStyle = `rgba(150,220,255,${pulse})`;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(tx, ty);
      ctx.stroke();
      // 目標冰圈
      ctx.strokeStyle = `rgba(200,240,255,${pulse*0.8})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(tx, ty, 12, 0, 7);
      ctx.stroke();
    }
  }
}

function drawPowerDetail(sx, sy, sw, sh, H){
  const cx = sx + sw/2;
  const cy = sy - H + sh/2;
  // 閃電
  ctx.fillStyle = '#ffe066';
  ctx.beginPath();
  ctx.moveTo(cx+3, cy-14);
  ctx.lineTo(cx-6, cy+1);
  ctx.lineTo(cx, cy+1);
  ctx.lineTo(cx-3, cy+14);
  ctx.lineTo(cx+7, cy-2);
  ctx.lineTo(cx+1, cy-2);
  ctx.closePath();
  ctx.fill();
  // 煙囪
  ctx.fillStyle = '#4a5a6a';
  ctx.fillRect(sx+8, sy-H-6, 6, 12);
  ctx.fillRect(sx+sw-14, sy-H-6, 6, 12);
  // 通電
  if(Math.floor(G.time*3)%2===0){
    ctx.fillStyle = 'rgba(255,240,150,0.6)';
    ctx.beginPath();
    ctx.arc(cx, cy, 3, 0, 7);
    ctx.fill();
  }
}

function drawRecycleDetail(sx, sy, sw, sh, H){
  const cx = sx + sw/2;
  const cy = sy - H + sh/2;
  // 循環箭頭
  ctx.strokeStyle = '#c8f0d8';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(cx, cy, 10, 0.4, 2.1);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx, cy, 10, 3.5, 5.2);
  ctx.stroke();
  // 箭頭
  ctx.fillStyle = '#c8f0d8';
  ctx.beginPath();
  ctx.moveTo(cx+11, cy-4);
  ctx.lineTo(cx+6, cy+1);
  ctx.lineTo(cx+14, cy+1);
  ctx.closePath();
  ctx.fill();
  // 材料點
  if(Math.floor(G.time*2)%2===0){
    ctx.fillStyle = 'rgba(255,215,120,0.9)';
    ctx.fillRect(cx-2, cy-2, 4, 4);
  }
}

function drawDumpDetail(e, sx, sy, sw, sh, H){
  const cx = sx + sw/2;
  const cy = sy - H + sh/2;
  // 垃圾堆
  const cols = ['#7a8a5a','#8a7a5a','#5a7a6a','#9a8a6a'];
  for(let i=0;i<5;i++){
    const gx = sx + 10 + (i*17)%(sw-20);
    const gy = sy - H + 12 + (i*13)%(sh-20);
    ctx.fillStyle = cols[i%cols.length];
    ctx.beginPath();
    ctx.arc(gx, gy, 6, 0, 7);
    ctx.fill();
  }
  // 廠房
  ctx.fillStyle = '#8a6a4a';
  ctx.fillRect(sx+sw-22, sy-H+6, 18, 12);
  ctx.fillStyle = '#d8c060';
  ctx.fillRect(sx+sw-18, sy-H+10, 10, 4);

  if(e.pulse > 0){
    ctx.strokeStyle = `rgba(255,230,120,${e.pulse*2})`;
    ctx.lineWidth = 2;
    ctx.strokeRect(sx+1, sy-H+1, sw-2, sh-2);
  }
}

function drawTechDetail(e, sx, sy, sw, sh, H){
  const cx = sx + sw/2;
  const cy = sy - H + sh/2;

  if(e.defId === 'tech'){
    // 雷達碟
    ctx.fillStyle = '#b8a8e8';
    ctx.beginPath();
    ctx.ellipse(cx, cy-4, 12, 5, -0.3, 0, 7);
    ctx.fill();
    ctx.fillStyle = '#8a7ac8';
    ctx.fillRect(cx-2, cy-2, 4, 10);
    // 底部
    ctx.fillStyle = '#5a4a8a';
    ctx.fillRect(cx-10, cy+6, 20, 6);
    // 發光
    const glow = 0.4 + Math.sin(G.time*3)*0.3;
    ctx.fillStyle = `rgba(180,150,255,${glow})`;
    ctx.beginPath();
    ctx.arc(cx+10, cy-10, 3, 0, 7);
    ctx.fill();
  }
  else if(e.defId === 'superbase'){
    // 中央炮台
    ctx.fillStyle = '#d0a0a0';
    ctx.beginPath();
    ctx.arc(cx, cy, 11, 0, 7);
    ctx.fill();
    ctx.fillStyle = '#a05050';
    ctx.beginPath();
    ctx.arc(cx, cy, 7, 0, 7);
    ctx.fill();
    // 炮管
    ctx.fillStyle = '#3a2a2a';
    ctx.fillRect(cx-2, cy-16, 4, 12);
    // 能量環
    const ringPulse = 0.5 + Math.sin(G.time*4)*0.4;
    ctx.strokeStyle = `rgba(255,200,100,${ringPulse})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, 14, 0, 7);
    ctx.stroke();
    // 頂燈
    ctx.fillStyle = `rgba(255,80,80,${ringPulse})`;
    ctx.beginPath();
    ctx.arc(cx, cy-18, 2.5, 0, 7);
    ctx.fill();
  }
}

/* --- 垃圾車 --- */
function drawTrucks(){
  for(const t of G.trucks){
    ctx.save();
    ctx.translate(t.x, t.y);
    ctx.rotate(t.angle);

    // 陰影
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(1, 1, 12, 7, 0, 0, 7);
    ctx.fill();

    // 車身
    ctx.fillStyle = '#3a7a4a';
    ctx.fillRect(-12, -7, 22, 14);
    // 垃圾箱
    ctx.fillStyle = '#6a7a5a';
    ctx.fillRect(-12, -7, 14, 14);
    ctx.fillStyle = '#8a9a6a';
    ctx.fillRect(-12, -7, 14, 3);
    // 車頭
    ctx.fillStyle = '#d8d8d8';
    ctx.fillRect(6, -6, 7, 12);
    ctx.fillStyle = '#5ac0ff';
    ctx.fillRect(9, -4, 3, 4);
    // 輪子
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.arc(-7, -7, 3, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(-7, 7, 3, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(8, -7, 3, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(8, 7, 3, 0, 7); ctx.fill();

    ctx.restore();
  }
}

/* --- 物資箱 --- */
function drawBoxes(){
  for(const b of G.boxes){
    const px = b.x*TX, py = b.y*TY;
    const bob = Math.sin(G.time*3 + b.t) * 2.5;
    const alpha = b.life < 4 ? (0.35 + 0.65*Math.abs(Math.sin(G.time*8))) : 1;

    ctx.globalAlpha = alpha;

    // 陰影
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(px+TX/2, py+TY-3, 8, 4, 0, 0, 7);
    ctx.fill();

    // 箱體
    const bh = 16;
    const by = py + TY/2 - bh/2 + bob;
    ctx.fillStyle = '#c98f3d';
    ctx.fillRect(px+7, by, 16, bh);
    ctx.fillStyle = '#8a5f24';
    ctx.fillRect(px+7, by+6, 16, 3);
    ctx.fillRect(px+13, by, 3, bh);
    ctx.strokeStyle = '#e8c274';
    ctx.lineWidth = 1;
    ctx.strokeRect(px+7.5, by+0.5, 15, bh-1);

    // 高光
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillRect(px+8, by+1, 5, 3);

    ctx.globalAlpha = 1;
  }
}

/* --- 彈道 --- */
function drawProjectiles(){
  for(const p of G.projectiles){
    const k = p.t / p.dur;
    if(p.type === 'bullet'){
      const x = p.x1 + (p.x2-p.x1)*k;
      const y = p.y1 + (p.y2-p.y1)*k;
      ctx.strokeStyle = 'rgba(255,240,150,0.9)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(p.x1, p.y1);
      ctx.lineTo(x, y);
      ctx.stroke();
      ctx.fillStyle = '#fff8c0';
      ctx.beginPath();
      ctx.arc(x, y, 2, 0, 7);
      ctx.fill();
    }
    else if(p.type === 'rocket'){
      const arc = Math.sin(k * Math.PI) * 20;
      const x = p.x1 + (p.x2-p.x1)*k;
      const y = p.y1 + (p.y2-p.y1)*k - arc;
      // 尾焰
      ctx.fillStyle = 'rgba(255,180,80,0.7)';
      ctx.beginPath();
      ctx.arc(x, y, 3, 0, 7);
      ctx.fill();
      ctx.fillStyle = '#ff5555';
      ctx.beginPath();
      ctx.arc(x, y, 1.5, 0, 7);
      ctx.fill();
    }
  }
}

/* --- 粒子 --- */
function drawParticles(){
  for(const p of G.particles){
    const a = Math.max(0, p.life / p.max);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

/* --- 特效 --- */
function drawEffects(){
  for(const e of G.effects){
    const k = e.t / e.dur;

    if(e.type === 'explosion'){
      ctx.globalAlpha = (1-k) * 0.9;
      const grd = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.r*(0.3+k));
      grd.addColorStop(0, 'rgba(255,240,180,1)');
      grd.addColorStop(0.4, 'rgba(255,150,50,0.8)');
      grd.addColorStop(1, 'rgba(255,80,20,0)');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r*(0.3+k), 0, 7);
      ctx.fill();
    }
    else if(e.type === 'super'){
      // 光柱
      ctx.globalAlpha = 1 - k;
      const grd = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.r*(0.2+k*1.2));
      grd.addColorStop(0, 'rgba(255,255,255,1)');
      grd.addColorStop(0.15, 'rgba(180,240,255,1)');
      grd.addColorStop(0.5, 'rgba(80,180,255,0.7)');
      grd.addColorStop(1, 'rgba(40,100,200,0)');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r*(0.2+k*1.2), 0, 7);
      ctx.fill();

      // 衝擊環
      ctx.strokeStyle = `rgba(220,245,255,${(1-k)*0.9})`;
      ctx.lineWidth = 4 * (1-k) + 1;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r*(0.3+k*1.3), 0, 7);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
}

/* --- 建造預覽 --- */
function drawPreview(){
  if(G.superAim){
    if(mouse.gx < 0 || mouse.gx >= COLS || mouse.gy < 0 || mouse.gy >= ROWS) return;
    const R = SUPER.radius;
    ctx.globalAlpha = 0.7;
    ctx.strokeStyle = '#8ef0ff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(mouse.gx*TX+TX/2, mouse.gy*TY+TY/2, R*TX, 0, 7);
    ctx.stroke();
    ctx.fillStyle = 'rgba(80,200,255,0.12)';
    ctx.beginPath();
    ctx.arc(mouse.gx*TX+TX/2, mouse.gy*TY+TY/2, R*TX, 0, 7);
    ctx.fill();
    ctx.globalAlpha = 1;
    return;
  }

  if(!G.selectedBuild) return;
  if(mouse.gx < 0 || mouse.gx >= COLS || mouse.gy < 0 || mouse.gy >= ROWS) return;

  const def = DEFS[G.selectedBuild];
  if(!def) return;

  const ok = canPlace(def, mouse.gx, mouse.gy) && G.materials >= def.cost;
  const sx = mouse.gx*TX, sy = mouse.gy*TY;
  const sw = def.size*TX, sh = def.size*TY;

  ctx.globalAlpha = 0.5;
  ctx.fillStyle = ok ? def.color : '#ff5555';
  ctx.fillRect(sx+2, sy+2, sw-4, sh-4);

  ctx.globalAlpha = 0.9;
  ctx.strokeStyle = ok ? '#8ef0ff' : '#ff5555';
  ctx.lineWidth = 2;
  ctx.strokeRect(sx+1, sy+1, sw-2, sh-2);

  // 顯示阻擋值
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 10px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(bname(G.selectedBuild), sx+sw/2, sy+sh/2-2);
  ctx.textAlign = 'left';
}

/* ══════════════ UI 更新 ══════════════ */
function buildUI(){
  const buildsEl = document.getElementById('builds');
  buildsEl.innerHTML = '';
  for(const id in DEFS){
    const d = DEFS[id];
    const el = document.createElement('div');
    el.className = 'btn';
    el.dataset.id = id;
    el.dataset.tip = 'b:' + id;
    const extra = [];
    if(d.size === 2) extra.push('2×2');
    const pw = powerOf(id);
    if(pw > 0) extra.push(`+${pw}⚡`);
    else if(pw < 0) extra.push(`⚡${-pw}`);
    el.innerHTML = `<span class="key">${d.key || ''}</span>
      <span class="nm">${bname(id)}</span>
      <span class="cost">🪵${d.cost} ${extra.join(' ')}</span>`;
    el.onclick = () => {
      if(G.paused) return;
      if(id === 'superbase' && !G.techUnlocked){ toast(L().tNeedTech, true); return; }
      G.selectedBuild = G.selectedBuild === id ? null : id;
      G.superAim = false;
      updateUI();
    };
    buildsEl.appendChild(el);
  }

  const skillsEl = document.getElementById('skills');
  skillsEl.innerHTML = '';
  const su = document.createElement('div');
  su.className = 'btn';
  su.dataset.id = 'super';
  su.dataset.tip = 'super';
  su.style.width = '228px';
  su.innerHTML = `<span class="key">R</span>
    <span class="nm">🛰️ ${bname('super')}</span>
    <span class="cost">${L().superBtn()}</span>
    <div class="cdmask" style="display:none"></div>`;
  su.onclick = () => {
    if(G.paused) return;
    if(!G.superUnlocked){ toast(L().tNeedSuper, true); return; }
    if(G.superCD > 0){ toast(L().tCooldown(Math.ceil(G.superCD)), true); return; }
    G.superAim = !G.superAim;
    G.selectedBuild = null;
    updateUI();
  };
  skillsEl.appendChild(su);
}

function updateUI(){
  document.getElementById('mats').textContent = Math.floor(G.materials);
  document.getElementById('powerTxt').textContent = `${G.power.cons}/${G.power.prod}`;
  const pp = document.getElementById('powerPill');
  pp.style.borderColor = G.power.ok ? 'rgba(90,170,230,.35)' : '#ff6b6b';

  document.getElementById('unitTxt').textContent = `${G.trucks.length}/${MAX_TRUCKS}`;
  document.getElementById('waveTxt').textContent =
    L().wave(Math.min(G.wave+1, WAVES.length), WAVES.length);

  const phasePill = document.getElementById('phasePill');
  const phaseTxt = document.getElementById('phaseTxt');
  const timerTxt = document.getElementById('timerTxt');

  if(G.phase === 'prep'){
    phaseTxt.textContent = L().phasePrep;
    phasePill.classList.remove('danger');
    timerTxt.textContent = Math.ceil(Math.max(0,G.timer)) + 's';
  } else if(G.phase === 'tsunami'){
    // 湧浪中顯示「湧浪 n / N」；間隔中倒數到下一道湧浪（實際秒數）；最後一道湧浪後沿用海嘯標籤
    const w = WAVES[G.wave];
    // 沿用本幀注水所用的湧浪索引，HUD 與注水不會相差一幀
    const k = G.pulseIdx;
    const next = k >= 0 ? -1 : w.pulses.findIndex(s => s.at + s.dur > G.waveProgress);
    phasePill.classList.add('danger');
    if(k >= 0){
      phaseTxt.textContent = L().phaseSurge(k+1, w.pulses.length);
      timerTxt.textContent = '——';
    } else if(next >= 0){
      phaseTxt.textContent = L().phaseNextSurge;
      timerTxt.textContent = Math.max(0, Math.ceil((w.pulses[next].at - G.waveProgress) / G.waveSpeed)) + 's';
    } else {
      phaseTxt.textContent = L().phaseTsunami;
      timerTxt.textContent = '——';
    }
  } else if(G.phase === 'drain'){
    phaseTxt.textContent = L().phaseDrain;
    phasePill.classList.remove('danger');
    timerTxt.textContent = '——';
  }

  // 建造按鈕
  document.querySelectorAll('#builds .btn').forEach(el => {
    const id = el.dataset.id;
    const def = DEFS[id];
    const locked = G.materials < def.cost ||
      (id === 'superbase' && !G.techUnlocked);
    el.classList.toggle('sel', G.selectedBuild === id);
    el.classList.toggle('locked', locked);
  });

  // 超級武器按鈕
  const su = document.querySelector('#skills .btn');
  if(su){
    const mask = su.querySelector('.cdmask');
    su.classList.toggle('sel', G.superAim);
    su.classList.toggle('locked', !G.superUnlocked || G.superCD > 0);
    if(G.superCD > 0){
      mask.style.display = 'flex';
      mask.textContent = Math.ceil(G.superCD);
    } else {
      mask.style.display = 'none';
    }
  }
}

/* ══════════════ 縮放 ══════════════ */
function fit(){
  const s = Math.min(window.innerWidth / 980, window.innerHeight / 540);
  app.style.transform = `scale(${Math.min(s, 1.3)})`;
}
window.addEventListener('resize', fit);

/* ══════════════ 主迴圈 ══════════════ */
let lastT = performance.now();
function loop(now){
  const dt = Math.min((now - lastT) / 1000, 0.05);
  lastT = now;
  if(!G.paused) update(dt);
  render();
  requestAnimationFrame(loop);
}

/* ══════════════ 啟動 ══════════════ */
renderGround();
init();
applyLang(LANG);
fit();
showMenu();

requestAnimationFrame(t => { lastT = t; loop(t); });

// 只在測試旗標下公開唯讀測試介面
if(TEST) window.__tsunami = Object.freeze({ G, update, startGame, WAVES, HOME, COLS, ROWS, LOSE_DEPTH, pulseIndexAt, nextPulseIndex,
  BAY_PEAK, BAY_FLOOR,
  setSeed: s => { nextSeed = s; },          // 在 startGame 前呼叫
  rowProfile: w => G.bays[w].slice() });    // 第 w 波（0 起）的每列倍率副本

})();
</script>
