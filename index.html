<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>海嘯：最後防線 · Tsunami: Last Line</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;background:#080c12;overflow:hidden;
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    display:flex;align-items:center;justify-content:center}
  #app{position:relative;width:960px;height:520px;transform-origin:center center;
    box-shadow:0 0 80px rgba(0,120,200,.25);border-radius:10px;overflow:hidden;
    background:#0b1018}
  canvas{display:block;width:960px;height:520px;cursor:crosshair}

  /* HUD */
  #hud{position:absolute;top:0;left:0;right:0;height:50px;padding:6px 12px;
    display:flex;gap:7px;align-items:center;pointer-events:none;
    font-size:12.5px;color:#dceaf5;text-shadow:0 2px 6px #000;z-index:5}
  .pill{background:rgba(10,22,34,.75);border:1px solid rgba(90,170,230,.35);
    border-radius:20px;padding:4px 12px;backdrop-filter:blur(6px);
    display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:12px}
  .pill b{color:#ffd166;font-weight:700}
  #phasePill{border-color:rgba(255,180,80,.5)}
  #phasePill.danger{border-color:#ff4d4d;color:#ff8080;animation:pulse .6s infinite}
  @keyframes pulse{50%{background:rgba(120,20,20,.8)}}
  #spacer{flex:1}
  #hud .pill{pointer-events:auto}
  #pauseBtn{cursor:pointer;user-select:none}
  #pauseBtn:hover{border-color:rgba(120,210,255,.85)}

  /* 工具列 */
  #toolbar{position:absolute;bottom:0;left:0;right:0;height:80px;
    padding:5px 8px;display:flex;gap:10px;align-items:stretch;
    background:linear-gradient(to top,#070e16,#0a1520);
    border-top:1px solid rgba(60,120,170,.3)}
  .group{display:flex;gap:5px;flex-wrap:wrap;align-content:flex-start}
  #builds{width:700px}
  #skills{width:240px;border-left:1px solid rgba(60,120,170,.2);padding-left:10px}
  .btn{background:rgba(16,30,44,.92);border:1px solid rgba(80,150,210,.3);
    border-radius:6px;padding:3px 4px;width:72px;height:34px;cursor:pointer;
    color:#cfe4f5;font-size:9.5px;text-align:center;transition:.1s;
    user-select:none;position:relative;overflow:hidden;line-height:1.2}
  .btn:hover{border-color:rgba(120,210,255,.85);background:rgba(26,50,72,.95);
    transform:translateY(-1px)}
  .btn.sel{border-color:#4fd8ff;background:rgba(28,84,124,.95);
    box-shadow:0 0 10px rgba(80,216,255,.55)}
  .btn.locked{opacity:.32;cursor:not-allowed;transform:none!important}
  #app.paused .btn{cursor:not-allowed}
  .btn .nm{font-weight:700;font-size:10px;color:#eaf6ff;display:block;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .btn .cost{color:#ffd166;font-size:9px;display:block}
  .btn .key{position:absolute;top:0px;right:2px;font-size:7.5px;color:#5a7a95}
  .cdmask{position:absolute;inset:0;background:rgba(0,0,0,.72);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:14px;font-weight:700;pointer-events:none}

  /* 開場 / 結算 */
  #overlay{position:absolute;inset:0;background:rgba(4,10,18,.95);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;text-align:center;color:#dceaf5;z-index:50;padding:24px;
    backdrop-filter:blur(4px)}
  #overlay h1{font-size:42px;letter-spacing:10px;
    background:linear-gradient(180deg,#8ee7ff,#1a7fc4);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:900;filter:drop-shadow(0 0 24px rgba(60,180,255,.5))}
  #overlay h2{font-size:20px;letter-spacing:3px;color:#ffd166}
  #overlay p{font-size:12.5px;line-height:1.9;color:#8fb3cc;max-width:620px}
  #overlay .hi{color:#5fd4ff;font-weight:700}
  #overlay .warn{color:#ff8a5c;font-weight:700}
  #startBtn,.langBtn{margin-top:6px;padding:10px 40px;font-size:15px;letter-spacing:3px;
    border:1px solid #4fd8ff;border-radius:30px;background:rgba(20,70,110,.6);
    color:#dff4ff;cursor:pointer;transition:.15s;font-weight:700}
  #startBtn:hover,.langBtn:hover{background:rgba(40,140,200,.85);box-shadow:0 0 30px rgba(80,216,255,.6);
    transform:scale(1.05)}
  #overlay.hidden{display:none}
  .langs{display:flex;gap:14px;margin-top:6px}
  #langLink{margin-top:4px;font-size:11.5px;color:#5a7a95;cursor:pointer;text-decoration:underline}

  #toast{position:absolute;top:56px;left:50%;transform:translateX(-50%);
    background:rgba(20,60,90,.92);border:1px solid #5fd4ff;border-radius:8px;
    padding:5px 16px;color:#dff4ff;font-size:12px;opacity:0;pointer-events:none;
    transition:opacity .25s;white-space:nowrap;z-index:40}
  #toast.show{opacity:1}

  /* 提示 */
  #tip{position:absolute;z-index:45;max-width:250px;padding:6px 10px;
    background:rgba(8,18,28,.95);border:1px solid rgba(95,212,255,.6);border-radius:6px;
    color:#cfe4f5;font-size:11px;line-height:1.65;pointer-events:none;display:none}
  #tip b{color:#ffd166}
  #tip .t{display:block;font-weight:700;color:#eaf6ff;font-size:12px}
</style>
</head>
<body>
<div id="app">
  <canvas id="game" width="960" height="520"></canvas>

  <div id="hud">
    <div class="pill" data-tip="mats"><span>🪵</span><b id="mats">0</b></div>
    <div class="pill" id="powerPill" data-tip="power"><span>⚡</span><b id="powerTxt">0/0</b></div>
    <div class="pill" data-tip="trucks"><span>🚛</span><b id="unitTxt">0</b></div>
    <div class="pill" id="phasePill" data-tip="phase"><span id="phaseTxt"></span></div>
    <div class="pill" data-tip="phase"><span id="timerTxt">45s</span></div>
    <div id="spacer"></div>
    <div class="pill" data-tip="wave"><span id="waveTxt"></span></div>
    <div class="pill" id="pauseBtn" data-tip="pause">⏸</div>
  </div>

  <div id="toolbar">
    <div class="group" id="builds"></div>
    <div class="group" id="skills"></div>
  </div>

  <div id="toast"></div>
  <div id="tip"></div>

  <div id="overlay"></div>
</div>

<script src="lang/zh-Hant.js"></script>
<script src="lang/en.js"></script>
<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/canvas.js"></script>
<script src="js/util.js"></script>
<script src="js/render-ground.js"></script>
<script src="js/i18n.js"></script>
<script src="js/menu.js"></script>
<script src="js/flow.js"></script>
<script src="js/water.js"></script>
<script src="js/entities.js"></script>
<script src="js/towers.js"></script>
<script src="js/trucks.js"></script>
<script src="js/update.js"></script>
<script src="js/boxes.js"></script>
<script src="js/input.js"></script>
<script src="js/tips.js"></script>
<script src="js/pause.js"></script>
<script src="js/super.js"></script>
<script src="js/toast.js"></script>
<script src="js/render.js"></script>
<script src="js/hud.js"></script>
<script src="js/main.js"></script>
</body>
</html>
